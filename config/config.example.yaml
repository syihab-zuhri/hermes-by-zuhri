# Recommended Hermes Configuration (OMP Enhanced by Zuhri)
# Placed in ~/.hermes/config.yaml

model:
  default: "combo-cepet-habis"
  provider: "custom"
  base_url: "http://127.0.0.1:20129/v1"
  api_key: ${OPENAI_API_KEY}

database:
  journal_mode: wal

runtime:
  nofile_soft_limit: 4096

agent:
  max_turns: 500
  verbose: false
  reasoning_effort: medium
  personalities: {}

terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto

browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

# Extended Context 512K Tuning
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.8
  target_ratio: 0.2
  protect_last_n: 40
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3

display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  tool_progress: all

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10

delegation:
  max_iterations: 250

skills:
  creation_nudge_interval: 15

kanban:
  review_dispatch: true

code_execution:
  timeout: 300
  max_tool_calls: 50

# MCP Servers (uncomment as needed)
mcp_servers:
  context7:
    url: https://mcp.context7.com/mcp
    enabled: true
  deepwiki:
    url: https://mcp.deepwiki.com/mcp
    enabled: true
